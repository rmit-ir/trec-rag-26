[project]
name = "trec-rag-26-task-search-serve"
version = "0.0.0"
description = "Search engine + REST API over a built-index dir (vectors + DiskANN + docstore)."
requires-python = "==3.11.*"
dependencies = [
  # Same numerical / model stack as the build task — keeps the on-disk format
  # contract identical end-to-end.
  "numpy<2",
  "torch>=2.2",
  "sentence-transformers>=3.1",
  "einops>=0.7",
  "peft>=0.11",
  "diskannpy>=0.7",
  # docstore decompression
  "zstandard>=0.22",
  # REST API stack
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "orjson>=3.10",
  # optional but very nice: per-process worker management
  "gunicorn>=22.0",
]

[tool.uv]
# Keep this task fully isolated from the repo-root env and from sibling tasks.
package = false

# Same CUDA wheel index as the build task.
[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
