[project]
name = "trec-rag-26"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "python-dotenv>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# src-layout: packages live under src/ but are exposed at the top level, so they
# import as `utils.*` / `tools.*` (not `src.utils.*`). `uv sync` installs them
# editable, so imports resolve no matter where a script is run from.
[tool.hatch.build.targets.wheel]
sources = ["src"]
packages = ["src/utils", "src/tools", "src/ragrun", "src/agent_harness"]

[dependency-groups]
# Test harness for src/ (shared layers + every system). Hermetic by default:
# `uv run --group dev pytest` needs no creds and makes no network calls.
dev = [
    "pytest>=8.4",
]
# Per-system dep groups — default `uv sync` installs none of them.
# Install one with `uv sync --group <name>` (e.g. `uv sync --group aus-agent`),
# then run scripts with `uv run --group <name> python …`.
# aus_agent RAG harness (src/systems/aus_agent) — Bedrock + OpenAI Responses
# backends. The openai floor is 2.x: providers/openai.py leans on Responses
# API surface (store=False + encrypted reasoning include) absent in 1.x.
aus-agent = [
    "boto3>=1.40",
    "openai>=2.45",
]
# Tongyi DeepResearch port (src/systems/ali_deepresearch)
ali-deepresearch = [
    "openai>=1.60",
]
# facet_rag plan-then-execute multi-facet RAG (src/systems/facet_rag). Reuses
# the aus_agent pluggable providers (Bedrock + OpenAI) behind the shared
# Provider contract, so it needs the same two SDKs.
facet-rag = [
    "boto3>=1.40",
    "openai>=2.45",
]
# facets_agent: minimal-prompt, facet_rag-inspired agent on the shared
# aus_agent staged-context harness (src/systems/facets_agent) -- runs
# gpt-5.6-luna via the OpenAI Responses backend by default. Same two SDKs as
# aus-agent/facet-rag since it reuses aus_agent.agent.make_provider.
facets-agent = [
    "boto3>=1.40",
    "openai>=2.45",
]
# brief_revise_agent: fork of aus_agent (same harness config) plus a
# pre-flight requirements brief and one review-and-revise pass
# (src/systems/brief_revise_agent). Same two SDKs as aus-agent since it
# reuses aus_agent.agent.make_provider via agent_harness -- no new
# dependencies (PLAN.md §6 Phase 0).
brief-revise-agent = [
    "boto3>=1.40",
    "openai>=2.45",
]
# OpenAI o3-deep-research baseline (src/systems/o3_deep_research) — Responses
# API runner + the ClimbMix MCP server (src/mcp) it grounds the agent on.
o3-deep-research = [
    "openai>=2.45",
    "mcp>=1.10",
    "uvicorn>=0.30",
]
notebook = [
    "pandas",
    "pyarrow",
    "matplotlib",
    "ipykernel",
    "jupyter",
    "nbconvert",
]

[tool.pytest.ini_options]
# `src/systems` is on the path (not just `src`) because each system package
# imports its siblings flat — `from aus_agent.providers...`, `from
# ali_deepresearch.answer_format...` — matching every run.py's import surgery.
# `importmode=importlib` lets same-named test modules coexist across systems
# without __init__.py files or module-name collisions.
pythonpath = ["src", "src/systems", "tests"]
testpaths = ["tests"]
# Hermetic by default: bare `pytest` deselects `live`. Opt in with
# `pytest -m live`, or run everything with `pytest -m 'live or not live'`.
addopts = "-ra --strict-markers --import-mode=importlib -m 'not live'"
markers = [
    "live: hits real network services (search endpoints / model APIs); needs creds. Deselected by default.",
    "contract: input/output format conformance against the TREC RAG 2026 spec.",
    "local_socket: real HTTP over loopback against the dummy API server (tests/dummy_api). No creds, runs by default.",
]
