           padding: 14px 20px; border-bottom: 1px solid var(--line); background: var(--panel); }

  .card .title { font-weight: 600; }
  .node rect { fill: var(--panel); stroke: var(--line); stroke-width: 1.5; rx: 8; }
  .lbl { fill: var(--ink); }
  .sub2 { fill: var(--muted); font-size: 11px; }
  .edge { fill: none; stroke-width: 2; opacity: .85; }
  .edge.dim { opacity: .12; }
  .engine rect { fill: var(--panel); stroke: var(--line); rx: 6; }
  .hint { fill: var(--muted); font-size: 11px; }
  #tip { position: absolute; pointer-events: none; background: var(--panel);
         border: 1px solid var(--cardstroke); border-radius: 6px; padding: 6px 9px;
         font-size: 12px; max-width: 320px; color: var(--ink); box-shadow: 0 4px 14px rgba(0,0,0,.18);
         opacity: 0; transition: opacity .1s; }
  .stage { cursor: pointer; }
  .stage rect { rx: 9; stroke-width: 2; }
  .stage:hover rect, .stage:focus rect { stroke-width: 3.5; }
  .k-llm      { fill: color-mix(in srgb, var(--e-provider) 18%, var(--panel)); stroke: var(--e-provider); }
  .k-retrieval{ fill: color-mix(in srgb, var(--e-retrieval) 18%, var(--panel)); stroke: var(--e-retrieval); }
  .k-format   { fill: color-mix(in srgb, var(--e-answer-format) 18%, var(--panel)); stroke: var(--e-answer-format); }
  .k-artifact { fill: color-mix(in srgb, var(--e-artifacts) 18%, var(--panel)); stroke: var(--e-artifacts); }
  .k-loop     { fill: var(--card); stroke: var(--accent); stroke-dasharray: 5 4; }
  .k-no-llm   { fill: var(--card); stroke: var(--cardstroke); }
  .runbadge   { fill: var(--muted); font-weight: 700; letter-spacing: .4px; }
  .loop-rect  { fill: none; stroke: var(--accent); stroke-dasharray: 6 5; stroke-width: 1.5; }
  .loop-rect.ghost1 { opacity: .35; }
  .loop-rect.ghost2 { opacity: .2; }
  .loop-label { fill: var(--muted); font-size: 11px; font-weight: 600; }
  #detail { position: fixed; top: 0; right: 0; width: min(440px, 45vw); height: 100%;
            overflow-y: auto; background: var(--panel); border-left: 1px solid var(--line);
            padding: 16px; box-shadow: -6px 0 18px rgba(0,0,0,.15); z-index: 5; }
  #detail[hidden] { display: none; }
  #detail h2 { margin: 4px 0 2px; font-size: 15px; }
  #detail h3 { margin: 14px 0 4px; font-size: 11px; letter-spacing: .6px; color: var(--muted);
               text-transform: uppercase; }
  #detail p { margin: 4px 0; font-size: 12px; }
  #detail pre { white-space: pre-wrap; font-size: 11px; background: var(--card);
                border: 1px solid var(--line); border-radius: 6px; padding: 8px;
                max-height: 280px; overflow: auto; margin: 4px 0 10px; }
  #detail code { font-size: 11px; color: var(--muted); word-break: break-all; }
  #detail ul { font-size: 12px; margin: 2px 0 0 18px; padding: 0; }
  #detail-close { position: absolute; top: 10px; right: 10px; padding: 2px 9px; }

ve Bedrock Converse toolConfig, passed once to provider.start (agent.run_agent: build_search_tool_def(engines) + GET_DOCUMENTS_TOOL + COMMIT_CONTEXT_TOOL)","run":"code"},{"id":"search","label":"SEARCH","kind":"retrieval","note":"full-text search; results staged","code":["systems/aus_agent/tools/search.py::execute_full_text_search"],"run":"code"},{"id":"stage","label":"STAGE","kind":"no-llm","note":"stage evidence; commit-before-expire protocol","code":["systems/aus_agent/context.py::ContextLedger.stage"],"run":"code"},{"id":"commit","label":"REASON/COMMIT","kind":"llm","note":"model turn commits selected evidence","prompt":["systems/aus_agent/prompts/system/default.md","systems/aus_agent/agent.py::TASK_PROMPT"],"code":["systems/aus_agent/tools/commit_context.py::apply_commit","systems/aus_agent/context.py::ContextLedger.commit"],"run":"llm+code"},{"id":"final","label":"FINAL PROSE","kind":"llm","note":"grounded prose with inline citations","prompt":["systems/aus_agent/prompts/system/default.md"],"tools_note":"same conversation as the loop — the report is a turn, not a new call","run":"llm"},{"id":"map","label":"MAP CITES","kind":"format","note":"docid -> reference-index mapping","code":["systems/aus_agent/agent.py::_map_citations"],"run":"code"},{"id":"save","label":"SAVE","kind":"artifact","note":"ragrun.save_run","code":["ragrun/outputs.py::save_run"],"run":"code"}],"edges":[{"to":"ragrun","type":"artifacts"},{"to":"search_tool","type":"retrieval"}]},{"name":"claude-code-research","kind":"manual","modules":[],"blurb":"workflow-driven research (no python pipeline package)","stages":[{"id":"workflow","label":"WORKFLOW","kind":"no-llm","note":"workflow-driven (scripts/ + tasks/), no python pipeline package"}],"edges":[{"to":"ragrun","type":"artifacts"},{"to":"search_tool","type":"retrieval"},{"to":"fetch_doc","type":"fetch-doc"},{"to":"hybrid_search","type":"retrieval"}]},{"name":"facet_rag","kind":"agent","modules":["__init__","curator","llm","loop","pipeline","plan e"},{"id":"format","label":"FORMAT","kind":"format","note":"answer_format: -> references[] + citations","prompt":["systems/ali_deepresearch/prompts.py::FORMAT_ANSWER_PROMPT"],"code":["systems/ali_deepresearch/answer_format.py::format_answer"],"run":"llm+code"},{"id":"save","label":"SAVE","kind":"artifact","note":"ragrun.save_run","code":["ragrun/outputs.py::save_run"],"run":"code"}],"edges":[{"to":"answer_format","type":"answer-format"},{"to":"ragrun","type":"artifacts"}]}],"shared":[{"id":"make_provider","label":"make_provider","role":"provider","detail":"aus_agent.agent — pluggable Bedrock/OpenAI backends"},{"id":"answer_format","label":"format_answer","role":"answer-format","detail":"ali_deepresearch.answer_format — prose -> references[] + per-sentence citations"},{"id":"search_tool","label":"tools.search_tool","role":"retrieval","detail":"run_search_tool / build_search_tool over ClimbMix"},{"id":"hybrid_search","label":"utils.search.search","role":"retrieval","detail":"concurrent dense + sparse retrieval, fused with RRF"},{"id":"fetch_doc","label":"utils.fetch_doc","role":"fetch-doc","detail":"fetch_doc(docid) -> full document text"},{"id":"ragrun","label":"ragrun","role":"artifacts","detail":"TrajectoryBuilder / build_rag_output / validate_rag_output / save_run"},{"id":"artifacts","label":"data/outputs/<system>/","role":"artifacts","detail":"<ts>.<slug>.trajectory.json (strict) + .output.json (rich)"}],"engines":[{"id":"semantic","label":"semantic","blurb":"semantic (dense embedding match): conceptual, definitional, or broad-topic needs and natural-question phrasing"},{"id":"keyword","label":"keyword","blurb":"keyword (hosted BM25, bag-of-words OR — operators are ignored): rare proper names, IDs, and verbatim strings; any query term may match, none is required"},{"id":"hybrid","label":"hybrid","blurb":"hybrid (dense+sparse fused with Reciprocal Rank Fusion): the safe general-purpose default — combines semantic's conceptual recall with keyword's exact-term precision, at roughly 2x the cost of a single-engine call"},{"id":"ssr","label":"ssr","blurb":"ssr (Cottontail Shortest-Substring Ranking, GCL Boolean): precise co-occurrence and phrases with REQUIRED terms; a required-but-absent term returns an empty set (a truthful zero) instead of a wrong near-match"},{"id":"lucene_bool","label":"lucene_bool","blurb":"lucene_bool (full Lucene query-parser over the BM25 index): Boolean AND/OR, required (+) / excluded (-) terms, phrases, and proximity — BM25-ranked"}],"prompts":{"systems/ali_deepresearch/prompts.py::SYSTEM_PROMPT":"You are a deep research assistant. Your core function is to conduct thorough, multi-source investigations into any topic. You must handle both broad, open-domain inquiries and queries within specialized academic fields. For every request, synthesize information from credible, diverse sources to deliver a comprehensive, accurate, and objective response. When you have gathered sufficient information and are ready to provide the definitive response, you must enclose the entire final answer within <answer><\/answer> tags.\n\n# Tools\n\nYou may call one or more functions to assist with the user query.\n\nYou are provided with function signatures within <tools><\/tools> XML tags:\n<tools>\n{\"type\": \"function\", \"function\": {\"name\": \"search\", \"description\": \"Search the local ClimbMix corpus and return a string of the top ranked passages, each with its DocID. Accepts a single query string.\", \"parameters\": {\"type\": \"object\", \"properties\": {\"query\": {\"type\": \"string\", \"description\": \"The search query.\"}}, \"required\": [\"query\"], \"example\": {\"name\": \"search\", \"arguments\": {\"query\": \"some search text\"}}, \"uniqueItems\": true}}}\n{\"type\": \"function\", \"function\": {\"name\": \"get_document\", \"description\": \"Retrieve the full content of one document given its DocID.\", \"parameters\": {\"type\": \"object\", \"properties\": {\"docid\": {\"type\": \"string\", \"description\": \"The DocID to retrieve.\"}}, \"required\": [\"docid\"], \"example\": {\"name\": \"get_document\", \"arguments\": {\"docid\": \"shard_00459_61697\"}}, \"uniqueItems\": true}}}\n<\/tools>\n\nYou must obey the following strict parameter formatting rules. Violating them is not allowed.\n\n# STRICT TOOL RULES:\n0. The ONLY available tools are search and get_document. Any tool not defined here DOES NOT EXIST and must not be referenced or used. Document retrieval is local. A DocID alone is sufficient to retrieve content using get_document. Use search to find document IDs or general information. Use get_document to retrieve document content.\n\n1. For the search tool, the ONLY allowed parameter structure is:\n{\"query\": \"some text\"}\n\nquery must be a plain string. No additional keys may be included.\n\n2. For the get_document tool, the ONLY allowed parameter structure is:\n{\"docid\": \"shard_00459_61697\"}\n\ndocid must be EXACTLY the DocID string extracted from search results.\nDo NOT prepend text such as \"DocID:\", \"ID=\", \"docid=\", \"document #\", URLs, paths, or filenames.\nDo NOT wrap the docid in other characters, such as brackets, quotes inside quotes, markup, or whitespace.\nThe value must be ONLY the DocID string exactly as it appeared in a search result.\nNEVER guess or fabricate a docid.\n\n3. DO NOT construct URLs or attempt to visit external pages. Never fabricate document content—always retrieve it with get_document.\nFor each function call, return a json object with function name and arguments within <tool_call><\/tool_call> XML tags:\n<tool_call>\n{\"name\": <function-name>, \"arguments\": <args-json-object>}\n<\/tool_call>\n\n4. YOU CAN NOT SCROLL\nRepeated calls with the same docid will return the same document content again, not a later section. Never use visit or scrolling behavior. If one document is insufficient, use search again or provide your best answer.\nYou may only call get_document after a search result explicitly supplies a DocID.\n\nIf the number of llm calls exceeds the limit, or you reached the maximum context length, you MUST stop making tool calls and based on all the information above, provide what you consider the most likely answer ONLY in the following format:<answer>your answer<\/answer>\n\n\n# Retriever behavior\nThe search tool de-duplicates across steps: a document already surfaced by an earlier search will NOT appear again in later search results (this keeps each search focused on new material). If you still need a document you have seen before, you can retrieve its full content at any time with get_document using its DocID. When a search hides earlier-seen relevant documents, it lists them under an \"Already-seen\" section so you can revisit them.\n\nCurrent date: ","systems/ali_deepresearch/prompts.py::FORMAT_ANSWER_PROMPT":"You convert a research answer into the strict TREC RAG 2026 citation format.\n\nYou are given (a) a DRAFT ANSWER and (b) a list of ALLOWED DOCIDS (ClimbMix corpus document ids the answer is grounded in).\n\nRewrite the draft as a list of short factual sentences. For every sentence, attach ONLY the docids from the ALLOWED DOCIDS list that GENUINELY AND DIRECTLY support that exact sentence — never pad the list to hit a target count. Zero citations is valid and correct for a sentence nothing in the allowed list actually supports; do not attach a weak or tangential docid just to have one. At most 3 citations per sentence when more than one applies, ordered from strongest to weakest support. Only cite docids from the ALLOWED DOCIDS list — never invent one. Keep the whole answer under 1024 words. Drop markdown formatting; produce plain declarative sentences.\n\nReturn ONLY a JSON object of this exact shape (no prose, no code fences):\n{{\"sentences\": [{{\"text\": \"<one sentence>\", \"citations\": [\"<docid>\", ...]}}, ...]}}\n\nDRAFT ANSWER:\n{answer}\n\nALLOWED DOCIDS:\n{docids}\n","systems/aus_agent/prompts/system/default.md":"# AUS research agent\n\nYou are a research agent for TREC RAG 2026. Answer what was actually asked,\ngrounded in what you find with your search tools. Prior knowledge may help you\nphrase searches and read results, but it is not evidence and must not support\nfactual claims.\n\nMatch your effort to the question. A narrow factual question deserves a couple\nof searches and a couple of sentences; a broad, multi-part request deserves\nsustained research and a full report. Answering a simple question at length\ndoes not make the answer better — it makes it worse, and it wastes the\nreader's time. Let the request set the size of both the search and the answer.\n\nThe request sets the kind of answer too, not just its size. A request to make\nsomething wants that thing actually built, carrying the voice, structure, and\ninvention the brief implies — not a summary of what your sources say about it.\nSome requests state that they want creativity; more often it is implicit, in a\ntask that cannot be done well without it or one dense enough that the work lies\nin connecting things rather than listing them. When the request calls for that,\ndo the creative work: synthesise across your sources into something that is\nyours, rather than restating each source in turn. Being evidence-grounded\nconstrains what you may assert, not how well you may write — every claim still\nneeds its support, but the argument, connections, and voice of the answer are\nyours to build.\n\n## Scope interpretation\n\nInfer the full deliverable from the entire request, including every concrete\nrequirement, audience constraint, comparison, example, and requested format.\nIf light framing such as \"overview\" or \"outline\" conflicts with substantial\nconcrete requirements, the concrete requirements define the real scope.\nResolve ambiguity toward the most useful reasonable reading — which for a\nnarrow question is a direct answer, not an expanded survey of the topic around\nit. Do not ask the user clarifying or confirming questions; proceed on the\nstrongest reasonable reading.\n\n## Internal success plan\n\nBefore the first search, work out — in proportion to the request; a single\nfactual question needs a moment's thought, not a plan:\n\n0. **Every requirement the request states.** Take them one at a time, in the\n   request's own terms, and say what each one demands of the finished answer.\n   A request that lists what each part must contain has given you a checklist,\n   and every item on it is a thing the answer is wrong without. A stated scope\n   — a period, a place, a population, a technical level — binds the searching\n   and the answer both: work inside it and treat today's date as a fact about\n   when you are reading, not as a licence to drift outside what was asked.\n   Before writing, check the report against the list and fix what is missing.\n\n1. **End goal** — one sentence describing what a complete deliverable provides.\n2. **Concrete minimum requirements** — the checkable floor that must be met\n   before the response is shippable.\n3. **Target/excellence requirements** — what a notably strong response adds\n   beyond the minimum without expanding scope.\n4. **Coverage areas** — the independent topics, claims, comparisons, examples,\n   dates, people, mechanisms, or perspectives that require evidence. Which of\n   these the corpus can actually support is unknown until it answers; the\n   opening searches exist to find that out before the answer's structure is\n   fixed. This list is provisional: searching reveals what the request\n   actually needs, and the plan is revised as it does.\n\nUse these requirements to plan searches, track coverage gaps, judge evidence,\nand decide when to stop. Do not expose this internal plan unless the requested\nanswer itself calls for it.\n\n## Research workflow\n\nResearch is one loop — search, commit, decide — repeated until the internal\nsuccess plan is satisfied:\n\n1. **Search.** Round one's queries come from the question: build them only\n   from the question's own wording and plain paraphrases of it. Do not seed\n   a query with candidate answers — specific names, techniques, causes,\n   examples — that the question itself does not mention: you do not know\n   what this corpus holds until it answers, no matter how well you know the\n   subject. In every later round, each new content-bearing query term must\n   be traceable to a document retrieved in an earlier round; prior knowledge\n   may rephrase, disambiguate, and supply synonyms — it may never introduce\n   a candidate the corpus has not yet surfaced.\n2. **Commit.** Read what came back and commit the documents whose distinct\n   contributions the answer will need. Committing nothing is the right call\n   for a batch with nothing worth keeping.\n3. **Decide.** Reflect before judging: searching teaches you what the\n   request actually needs, so first revise the plan against what retrieval\n   has shown. An aspect that retrieved material has revealed as important to\n   the request joins the coverage areas even though the opening plan missed\n   it; a planned area whose reformulated searches keep coming back empty is\n   recorded as unsupportable, not retried forever. Then compare committed\n   material against the revised plan. If a coverage area still lacks support\n   — or is supported only thinly where the request deserves depth — loop\n   again with queries aimed at that gap. The loop ends when every coverage\n   area of the current plan is resolved: committed material behind it, or\n   searches that failed to support it. Then write the report — only after\n   committing everything it will cite.\n\nNotes on the loop:\n\n- If reformulated question-term queries keep returning nothing useful, probe\n  candidates from prior knowledge, one query each. A candidate the corpus\n  then returns has been surfaced like any other retrieved material; one it\n  does not return stays out of the answer.\n- The answer's structure follows what was retrieved. Fix the outline — which\n  items, sections, comparisons — only after the rounds that surfaced those\n  items, so that every part of it traces to a committed document.\n- Size the search to the question. Several independent coverage areas call\n  for multiple complementary queries in parallel across them; a single fact,\n  name, date, or definition needs one or two queries, then the answer. Small\n  is not shallow: even the shortest answer rests on the strongest support\n  the corpus offers.\n- Move from broad discovery to targeted follow-ups on what earlier rounds\n  surfaced: specific names, dates, mechanisms, examples, definitions, causal\n  claims, and disputed points.\n- Reformulate weak queries instead of accepting poor coverage: synonyms,\n  alternative terminology, different phrasings.\n- Actively search for counter-evidence, contradictions, limitations, and\n  missing perspectives when they matter to the request.\n- Every tool call must have a concrete purpose tied to an unmet requirement\n  or evidence gap; never call a tool solely to create another model turn.\n\nSearch results already contain document text. Inspect that text directly; do\nnot call another tool merely to fetch the same document. The search tool\nnormally stages at most about 4,096 tokens per result; request a different\n`budget_tokens_per_result` only when a query genuinely needs a different\nper-document evidence depth.\n\n## Staged and committed evidence\n\nEvery retrieval batch is staged for exactly the immediately following model\nturn.\n\n- To keep anything from a batch, call `commit_context` on that turn. It may\n  appear anywhere among the turn's actions; searches in the same turn always\n  run after it.\n- If you issue no `commit_context` on that turn, the batch is treated as your\n  decision to keep none of it: every document is dropped and the turn's other\n  actions still run. That is the correct move when nothing in the batch is\n  worth keeping — but it is irreversible, so do not let a batch you wanted\n  lapse by forgetting.\n- List only results whose full text should persist into later turns.\n- Commit at most `__MAX_COMMITTED_DOCS__` results from one staged batch;\n  usually commit fewer.\n- Every selection reason must identify the result's distinct contribution:\n  the specific fact, date, name, mechanism, example, perspective,\n  counter-evidence, contradiction, or coverage gap it uniquely supports.\n- Commit each result by its `id` EXACTLY as returned, unedited — including any\n  `_p<n>` page suffix. A `_p<n>` suffix marks a page: `shard_01851_76734_p2` is\n  page 2 of `shard_01851_76734`. Never abbreviate to a fragment such as `01851`\n  (only the shard number, shared by many unrelated documents) and never strip\n  the `_p<n>` suffix: the page-specific id is what makes the evidence precise.\n  Distinct pages of one document are DISTINCT units — commit each page you need\n  separately, by its own id.\n- Never recommit an already committed id.\n- Skip semantically similar results when they support the same claim.\n  Commit both only when each contributes materially different evidence.\n- Every staged occurrence not selected is compacted/redacted before the\n  following turn. No unresolved staged batch carries forward.\n- Issue at most one `commit_context` per turn; several are ambiguous and lose\n  the batch.\n- New search calls may accompany `commit_context` in the same turn.\n\nReading more around a result: results are pages (`<docid>_p<page>`). When a\nresult is highly relevant and you want the surrounding context — the pages just\nbefore or after it — construct the neighbouring page ids (same docid, adjacent\n`_p<page>` numbers) and fetch them with `get_documents`. Its results are staged\nexactly like a search batch, so you commit the pages you need with\n`commit_context` on the following turn. Reading adjacent pages of a strong\nsource is encouraged; an id past the document's last page simply comes back as\nmissing. Prefer `get_documents` to re-searching once you know which document and\npages you want to read further.\n\nOnly committed evidence may support the final response. Track which committed\nids support which claims. If you cannot find support for a requested point,\nsay plainly in the report that you could not find it, rather than inventing an\nanswer — but say it in a searcher's voice, not in the vocabulary of this\nsection.\n\n## Budget and stopping\n\nThe research-context budget is 500,000 tokens measured from the current\ngeneration's provider-reported input tokens. That input already represents the\naccumulated conversation: system prompt, request, retained history, committed\nfull-text evidence, and the immediately previous staged tool results. Do not\nsum input-token counts from multiple generations; that would count the same\nretained context repeatedly.\n\nThe budget is a hard ceiling, not a spending target. Unused budget creates no\nobligation to continue researching — but quality does: after satisfying the\nconcrete minimum, keep improving toward the target/excellence requirements\nwhile you can name a specific weakness whose resolution would materially\nimprove the answer. An unresolved or thinly supported coverage area in the\ncurrent plan is always such a weakness.\n\nStop researching when any of these is true:\n\n1. the target/excellence requirements are met;\n2. the current generation input context budget is exhausted; or\n3. further searches are unlikely to produce meaningful improvement.\n\nIf stopping before all desired coverage is supported, give the best answer your\nevidence permits and say plainly what you could not find.\n\n## Final response contract\n\nWhen research is complete, emit no tool calls and write the final report as\nplain flowing prose in that same turn:\n\n- Write the report only after committing everything it will cite. A report\n  turn issues no tool calls, so a batch still staged when you start writing\n  lapses uncommitted and everything you meant to cite from it becomes\n  invalid — commit first, and write the report on the following turn.\n\n- Write exactly one sentence per line, in reading order. Blank lines between\n  thematic groups are allowed.\n- Cite evidence by placing committed `id`s (exactly as committed, including any\n  `_p<page>` suffix) in square-bracket markers after the end of the supporting\n  sentence, on the same line:\n  `<the sentence, ending in its full stop.> [id_1] [id_2]`\n- Markers are stripped before the sentence is submitted, so they must sit\n  outside its grammar: the sentence has to read correctly, and mean the same\n  thing, once every marker is deleted.\n- Cite at most three ids per sentence, and only ids that directly support that\n  sentence. Every factual sentence should carry at least one citation. Use only\n  committed ids; never fabricate facts or identifiers.\n- Organize the report through sentence order and clear topic sentences. Do not\n  use Markdown syntax (headings, bullets, numbering, bold, fences) or JSON.\n- That constraint is about layout, not content. Notation is not layout: when a\n  request asks for a derivation, or the point cannot be made precisely without\n  one, write the mathematics inline, in the sentence, naming each symbol as it\n  appears. A step of a derivation is a sentence like any other and carries its\n  markers. Prose is the medium here, so the work is to carry the reader through\n  the steps in sentences rather than to lay them out on separate display\n  lines — that is a reason to write the mathematics carefully, never a reason\n  to leave it out or to retreat to describing it from a distance.\n- Every line is a sentence of the report itself, read by someone who never saw\n  this conversation and who receives these lines verbatim. Open on the first\n  real sentence of the answer and close on its last. A line narrating your own\n  process — what you are about to do, how the research went, what you conclude\n  about your own conclusions — is not a report sentence and supports nothing.\n- Write in your own voice, as the researcher. Every sentence asserts something\n  about the subject the request asks about, and carries its markers. The\n  markers do the attributing, so a sentence never announces that it is\n  supported, nor what supports it, nor how far that support reaches.\n- Exactly one kind of sentence may be about you rather than the subject: that\n  you could not establish something. Say it once, plainly, in as few words as\n  the point needs — no narrating the attempt, no restating it in other words,\n  no explaining what left you unable. Everything else the reader receives is\n  about the world, dated and specific, not about the answer's own provenance.\n- Length follows the question, not the limit. Answer a narrow question in a\n  sentence or two and stop; there is nothing to be gained by surrounding a\n  one-line answer with background, and a reader who asked something simple\n  will not read an essay. Only a genuinely broad, multi-part request should\n  run long, and even then about 950 words is the practical ceiling: 1024 is a\n  hard limit set by the evaluation and going over costs a full rewrite. Never\n  pad toward a length.\n- If validation feedback identifies problems (uncommitted docids, Markdown or\n  JSON formatting, excessive citations, missing citations, or excessive\n  length), correct the report on the next turn in this same continuous\n  conversation using this same contract.\n- There is no separate finalizer, formatter, or compression phase.\n","systems/aus_agent/agent.py::TASK_PROMPT":"Current date and time: {now}\n\nResearch request:\n\n{query}\n","systems/facet_rag/prompts.py::PLAN_PROMPT":"You are the planning stage of a corpus-grounded research system. Your ONLY data source is the ClimbMix document corpus. There is no web search.\n\nBreak the research narrative below into a small set of independent RESEARCH FACETS. A facet is one distinct sub-question or aspect of the narrative that can be investigated on its own. Aim for {min_facets}-{max_facets} facets: enough to cover every distinct aspect the narrative raises, no more. Do not create two facets that would need the same evidence.\n\nFor each facet also estimate how many rounds of search-and-refine it will realistically need (``max_iterations``, an integer 1-10): 1-2 for a narrow, well-defined sub-question; up to 10 for a broad or ambiguous one likely to need several rounds of follow-up search to cover properly.\n\nReturn ONLY a JSON object of this exact shape (no prose, no code fences):\n{{\"facets\": [{{\"name\": \"<short aspect label>\", \"description\": \"<the specific sub-question this facet must answer>\", \"max_iterations\": <1-10>}}, ...]}}\n\nRESEARCH NARRATIVE:\n{narrative}\n","systems/facet_rag/prompts.py::ORCHESTRATOR_QUERY_PROMPT":"You are the search planner for one facet of a larger research task. Your ONLY data source is the ClimbMix document corpus — there is no web search.\n\nFACET: {facet_name}\n\n{facet_description}\n{context_block}\nWrite a DIFFERENT, natural-language query for EACH of these three engines, each phrased in that engine's own style (not a copy of the others):\n- semantic: {semantic_blurb}\n- keyword: {keyword_blurb}\n- hybrid: {hybrid_blurb}\n\nIf (and only if) this facet genuinely needs Boolean-precise co-occurrence, a required term, or a phrase/proximity match that natural language can't express, ALSO write one query for a Boolean engine — otherwise leave both boolean fields null:\n{boolean_blurbs}\n\nReturn ONLY a JSON object of this exact shape (no prose, no code fences):\n{{\"queries\": {{\"semantic\": \"<query>\", \"keyword\": \"<query>\", \"hybrid\": \"<query>\"}}, \"boolean_engine\": \"<engine name from the Boolean list above, or null>\", \"boolean_query\": \"<query in that engine's language, or null>\"}}\n","systems/facet_rag/prompts.py::ANALYZER_PROMPT":"You are the analyst for one facet of a corpus-grounded research task. Read the newly retrieved passages below and judge them ONLY against this facet's need — ignore anything irrelevant to it.\n\nFACET: {facet_name}\n\n{facet_description}\n\nEVIDENCE ALREADY SAVED FOR THIS FACET:\n{evidence_so_far}\n\nNEWLY RETRIEVED PASSAGES:\n{passages}\n\nFor each newly retrieved passage that supports the facet, keep it: note what it supports and why. Then judge whether the facet is now adequately covered by the saved + newly kept evidence together, or whether a specific gap remains that another search could fill (name the gap concretely, e.g. what aspect, entity, or comparison is still missing — not \"need more info\").\n\nReturn ONLY a JSON object of this exact shape (no prose, no code fences):\n{{\"relevant\": [{{\"docid\": \"<docid from the passages above>\", \"note\": \"<what it supports>\"}}, ...], \"gap\": \"<specific remaining gap, or null if none>\", \"satisfied\": <true if no further search is needed, else false>}}\n","systems/facet_rag/prompts.py::CURATOR_PROMPT":"You maintain the ranked evidence pool for one facet of a research task. Given the research narrative, the facet, and every piece of evidence gathered for it so far, rank the evidence from MOST to LEAST useful for answering the facet — like a priority queue where the top item is the single best piece of evidence and each one below is slightly less essential.\n\nMaximize two things together: RELEVANCE (how directly and specifically each item addresses the facet) and COVERAGE (how much of the facet's distinct sub-aspects the pool as a whole addresses). An item that states essentially the same point as a higher-ranked item is REDUNDANT — mark it ``redundant_with`` the higher-ranked item's docid and let it sink below items that cover a different angle, even if the redundant item is individually highly relevant on its own. Two items covering the same narrow point should not both sit near the top; prefer diversity of coverage there.\n\nRESEARCH NARRATIVE:\n{narrative}\n\nFACET: {facet_name}\n\n{facet_description}\n\nEVIDENCE POOL:\n{evidence}\n\nReturn ONLY a JSON object of this exact shape (no prose, no code fences):\n{{\"ranking\": [{{\"docid\": \"<docid>\", \"redundant_with\": \"<docid of a higher-ranked item this duplicates, or null>\"}}, ...], \"gap\": \"<what the top {top_n} still miss to fully address the facet, or null if nothing>\", \"covered\": <true if the top {top_n}, taken together, adequately address the facet, else false>}}\n","systems/facet_rag/prompts.py::SYNTH_DRAFT_PROMPT":"You are the synthesis stage of a corpus-grounded research system. Write a thorough, well-structured answer to the research narrative using ONLY the evidence below. Do not use prior knowledge for factual claims; every claim must be supported by evidence.\n\nWrite clear declarative prose. After each factual sentence, cite ONLY the docid(s) that GENUINELY AND DIRECTLY support that exact sentence, in square brackets, e.g. [shard_00123_456] — never cite a docid just because it's topically nearby; a claim with no genuinely supporting evidence gets no citation. Cite at most 3 docids per sentence, ordered strongest to weakest support; do not pad to 3 when fewer are actually supported. Only cite docids that appear in the evidence below. Keep the whole answer under 1000 words.\n\nRESEARCH NARRATIVE:\n{narrative}\n\nEVIDENCE:\n{evidence}\n","systems/facet_rag/prompts.py::FACT_CHECK_PROMPT":"You are the fact-checker for a corpus-grounded research report. Below is a draft answer and the evidence it was written from. Check EVERY citation individually: read the cited docid's actual evidence text and confirm it specifically and directly supports the exact claim in the sentence it's attached to — topical closeness is not enough. A citation that is merely about the same general subject, without actually stating the claim, is NOT supported and must be dropped.\n\nRewrite the draft, correcting it in place: drop every citation that fails that check, remove or soften sentences left with no supporting citation, and add a citation from the evidence below to any sentence with a factual claim that currently has none but could be genuinely supported. Where a sentence keeps multiple citations, order them strongest to weakest support, and never add a citation just to reach 3 — 1 correct citation beats 3 where 2 are padding. Do not add new claims that are not already in the draft or supportable by the evidence.\n\nReturn ONLY the corrected prose (no JSON, no commentary, no code fences).\n\nRESEARCH NARRATIVE:\n{narrative}\n\nDRAFT:\n{draft}\n\nEVIDENCE:\n{evidence}\n","systems/o3_deep_research/run.py::SYSTEM_PROMPT":"You are a research assistant producing a thorough, well-structured report. Your ONLY source of information is the ClimbMix document corpus, reachable through the `search` and `fetch` tools. Do not rely on prior knowledge for factual claims. Search broadly with varied queries, fetch the full text of every document you rely on before citing it, and cite the documents you used inline. Write the final report in clear prose."}}</script>
<script>
const MODEL = JSON.parse(document.getElementById('arch-model').textContent);
const SVG_NS = 'http://www.w3.org/2000/svg';
const svg = document.getElementById('stage');
const tip = document.getElementById('tip');
const crumb = document.getElementById('crumb');
const backBtn = document.getElementById('back');
const detail = document.getElementById('detail');
const detailBody = document.getElementById('detail-body');
const ENGINE_BLURB = Object.fromEntries(MODEL.engines.map(e => [e.id, e.blurb]));

const EDGE_TYPES = [
  ['retrieval','Retrieval (search layers)'],
  ['fetch-doc','fetch_doc'],
  ['answer-format','answer_format (reuse)'],
  ['provider','make_provider (reuse)'],
  ['artifacts','Artifacts (ragrun)'],
];
const edgeColor = t => getComputedStyle(document.documentElement)
  .getPropertyValue('--e-' + t).trim() || 'gray';

function el(name, attrs = {}, text) {
  const e = document.createElementNS(SVG_NS, name);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (text != null) e.textContent = text;
  return e;
}
function clear(n){ while(n.firstChild) n.removeChild(n.firstChild); }

// view is 'overview' or 'system' -- the drill-in legend swaps edge-type swatches
// for the run-class / loop-grouping key, since neither applies to the other view.
function buildLegend(view) {
  const box = document.getElementById('legend');
  clear(box);
  if (view === 'system') {
    ['LLM = calls a model', 'CODE = deterministic', 'LLM+CODE = both',
     'dashed box = loop span', 'stacked box = runs concurrently'].forEach(t => {
      const s = document.createElement('span'); s.className = 'lg'; s.textContent = t;
      box.appendChild(s);
    });
    return;
  }
  for (const [t, label] of EDGE_TYPES) {
    const s = document.createElement('span'); s.className = 'lg';
    const sw = document.createElement('span'); sw.className = 'sw';
    sw.style.background = edgeColor(t);
    s.appendChild(sw); s.appendChild(document.createTextNode(label));
    box.appendChild(s);
  }
  const hint = document.createElement('span'); hint.className = 'lg';
  hint.textContent = 'Click a system to drill into its pipeline.';
  box.appendChild(hint);
}

function showTip(evt, html) {
  tip.innerHTML = html;
  const r = svg.getBoundingClientRect();
  tip.style.left = (evt.clientX - r.left + 14) + 'px';
  tip.style.top  = (evt.clientY - r.top + 12) + 'px';
  tip.style.opacity = 1;
}
function hideTip(){ tip.style.opacity = 0; }

// ---- DETAIL PANEL (click-to-open, change #1 + #4) -------------------------
function closeDetail(){ detail.hidden = true; }
document.getElementById('detail-close').addEventListener('click', closeDetail);

// A stage lies inside a system's loop when its index falls within the loop's
// declared [back_to, back_from] span -- same span the bounding rect draws.
function findEnclosingLoop(sys, stg) {
  const lp = sys.stages.find(s => s.kind === 'loop');
  if (!lp || !lp.back_from || lp.id === stg.id) return null;
  const idx = id => sys.stages.findIndex(s => s.id === id);
  const from = idx(lp.back_from), to = lp.back_to ? idx(lp.back_to) : -1;
  const cur = idx(stg.id);
  return (from >= 0 && to >= 0 && cur >= to && cur <= from) ? lp : null;
}

function renderToolList(container, tools) {
  const groups = {};
  tools.forEach(t => { (groups[t.group] = groups[t.group] || []).push(t); });
  for (const group in groups) {
    const h = document.createElement('div'); h.className = 'hint'; h.style.marginTop = '6px';
    h.textContent = group + (groups[group].length > 1 ? 's' : '') + ':';
    container.appendChild(h);
    const ul = el2('ul');
    groups[group].forEach(t => {
      const li = el2('li');
      const b = el2('b'); b.textContent = t.name; li.appendChild(b);
      const desc = t.desc || (t.group === 'tool' ? 'schema built at runtime — see ' + t.ref
                                                  : (ENGINE_BLURB[t.name] || ''));
      if (desc) li.appendChild(document.createTextNode(' — ' + desc));
      ul.appendChild(li);
    });
    container.appendChild(ul);
  }
}
function el2(tag){ return document.createElement(tag); }

function showDetail(sys, stg) {
  clear(detailBody);
  detailBody.appendChild(Object.assign(el2('h2'), { textContent: stg.label }));
  const meta = el2('div'); meta.className = 'sub2';
  meta.textContent = stg.kind + (stg.run ? ' · ' + stg.run.toUpperCase() : '');
  detailBody.appendChild(meta);
  if (stg.note) detailBody.appendChild(Object.assign(el2('p'), { textContent: stg.note }));

  if (stg.prompt && stg.prompt.length) {
    detailBody.appendChild(Object.assign(el2('h3'), { textContent: 'Prompt' }));
    stg.prompt.forEach(ref => {
      detailBody.appendChild(Object.assign(el2('code'), { textContent: ref }));
      const pre = el2('pre'); pre.textContent = MODEL.prompts[ref] || '(prompt text unavailable)';
      detailBody.appendChild(pre);
    });
  }
  if (stg.code && stg.code.length) {
    detailBody.appendChild(Object.assign(el2('h3'), { textContent: 'Code' }));
    const ul = el2('ul');
    stg.code.forEach(ref => {
      const li = el2('li'); li.appendChild(Object.assign(el2('code'), { textContent: ref }));
      ul.appendChild(li);
    });
    detailBody.appendChild(ul);
  }

  const ownTools = stg.tools || [];
  const lp = findEnclosingLoop(sys, stg);
  const loopTools = (lp && lp.tools) ? lp.tools : [];
  if (ownTools.length || loopTools.length) {
    detailBody.appendChild(Object.assign(el2('h3'), { textContent: 'Tools / Engines' }));
    if (ownTools.length) renderToolList(detailBody, ownTools);
    if (loopTools.length) {
      const h4 = el2('div'); h4.className = 'hint'; h4.style.marginTop = '6px';
      h4.textContent = 'available in ' + lp.label + ':';
      detailBody.appendChild(h4);
      renderToolList(detailBody, loopTools);
    }
  }
  const note = stg.tools_note || (lp && lp.tools_note);
  if (note) detailBody.appendChild(Object.assign(el2('p'), { className: 'hint', textContent: note }));

  detail.hidden = false;
}

// ---- OVERVIEW ------------------------------------------------------------
function drawOverview() {
  crumb.textContent = 'overview';
  backBtn.style.display = 'none';
  closeDetail();
  buildLegend('overview');
  clear(svg);
  svg.removeAttribute('viewBox'); // clear() drops children only; a drill-in's viewBox would linger
  const W = svg.clientWidth || 1200, colGap = W / 5;
  const rowH = 64, pad = 30;
  const sysCol = colGap * 1.15, sharedCol = colGap * 2.6, engCol = colGap * 3.85;

  // shared-layer node positions (right column), ordered top->bottom
  const shared = MODEL.shared;
  const sHeight = Math.max(shared.length, MODEL.systems.length) * rowH + pad * 2;
  svg.setAttribute('height', Math.max(sHeight, svg.clientHeight));
  const sy0 = pad + 20;
  const sharedPos = {};
  shared.forEach((s, i) => { sharedPos[s.id] = { x: sharedCol, y: sy0 + i * rowH }; });

  const sysPos = {};
  MODEL.systems.forEach((s, i) => { sysPos[s.name] = { x: sysCol, y: sy0 + i * rowH }; });

  const edgesLayer = el('g'); svg.appendChild(edgesLayer);
  const nodesLayer = el('g'); svg.appendChild(nodesLayer);

  // All selectable engines hang off search_tool. The hybrid layer owns only
  // its semantic + keyword fan-out, so draw those two links separately.
  const st = sharedPos['search_tool'];
  const hybrid = sharedPos['hybrid_search'];
  MODEL.engines.forEach((e, i) => {
    const ey = st.y - ((MODEL.engines.length - 1) * 22) / 2 + i * 22;
    const g = el('g', { class: 'engine' });
    g.appendChild(el('rect', { x: engCol, y: ey - 9, width: 150, height: 18 }));
    g.appendChild(el('text', { x: engCol + 8, y: ey + 4, class: 'sub2' }, e.label));
    g.addEventListener('mousemove', ev => showTip(ev, '<b>'+e.label+'</b><br>'+e.blurb));
    g.addEventListener('mouseleave', hideTip);
    nodesLayer.appendChild(g);
    edgesLayer.appendChild(el('path', {
      class: 'edge', stroke: edgeColor('retrieval'),
      d: `M ${st.x+170} ${st.y} C ${engCol-30} ${st.y}, ${engCol-30} ${ey}, ${engCol} ${ey}`
    }));
    if (hybrid && (e.id === 'semantic' || e.id === 'keyword')) {
      edgesLayer.appendChild(el('path', {
        class: 'edge', stroke: edgeColor('retrieval'),
        d: `M ${hybrid.x+170} ${hybrid.y} C ${engCol-45} ${hybrid.y}, ${engCol-45} ${ey}, ${engCol} ${ey}`
      }));
    }
  });

  // system -> shared edges
  const allEdges = [];
  MODEL.systems.forEach(sys => {
    const a = sysPos[sys.name];
    sys.edges.forEach(e => {
      const b = sharedPos[e.to]; if (!b) return;
      const path = el('path', {
        class: 'edge', stroke: edgeColor(e.type),
        'data-sys': sys.name, 'data-type': e.type,
        d: `M ${a.x+170} ${a.y} C ${(a.x+b.x)/2} ${a.y}, ${(a.x+b.x)/2} ${b.y}, ${b.x} ${b.y}`
      });
      edgesLayer.appendChild(path);
      allEdges.push(path);
    });
  });
  // ragrun -> artifacts
  if (sharedPos['ragrun'] && sharedPos['artifacts']) {
    const a = sharedPos['ragrun'], b = sharedPos['artifacts'];
    edgesLayer.appendChild(el('path', { class:'edge', stroke: edgeColor('artifacts'),
      d:`M ${a.x+170} ${a.y} C ${(a.x+b.x)/2} ${a.y}, ${(a.x+b.x)/2} ${b.y}, ${b.x} ${b.y}`}));
  }

  // shared nodes
  shared.forEach(s => {
    const p = sharedPos[s.id];
    const g = el('g', { class: 'node' });
    g.appendChild(el('rect', { x: p.x, y: p.y - 18, width: 170, height: 36 }));
    g.appendChild(el('text', { x: p.x + 10, y: p.y - 1, class: 'lbl', 'font-weight':600 }, s.label));
    g.appendChild(el('text', { x: p.x + 10, y: p.y + 13, class: 'sub2' }, s.role));
    g.addEventListener('mousemove', ev => showTip(ev, '<b>'+s.label+'</b><br>'+s.detail));
    g.addEventListener('mouseleave', hideTip);
    nodesLayer.appendChild(g);
  });

  // system cards
  MODEL.systems.forEach(sys => {
    const p = sysPos[sys.name];
    const g = el('g', { class: 'card', tabindex: 0, role: 'button',
                        'aria-label': 'Open ' + sys.name + ' pipeline' });
    g.appendChild(el('rect', { x: p.x, y: p.y - 22, width: 170, height: 44 }));
    g.appendChild(el('text', { x: p.x + 10, y: p.y - 4, class: 'title lbl' }, sys.name));
    g.appendChild(el('text', { x: p.x + 10, y: p.y + 12, class: 'sub2' }, sys.kind));
    const focus = () => allEdges.forEach(pt =>
      pt.classList.toggle('dim', pt.getAttribute('data-sys') !== sys.name));
    const blur = () => allEdges.forEach(pt => pt.classList.remove('dim'));
    g.addEventListener('mouseenter', focus);
    g.addEventListener('mousemove', ev => showTip(ev, '<b>'+sys.name+'</b><br>'+sys.blurb));
    g.addEventListener('mouseleave', () => { blur(); hideTip(); });
    g.addEventListener('focus', focus);
    g.addEventListener('blur', blur);
    const open = () => { location.hash = encodeURIComponent(sys.name); };
    g.addEventListener('click', open);
    g.addEventListener('keydown', ev => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); open(); } });
    nodesLayer.appendChild(g);
  });

  // column headers
  const head = (x, t) => nodesLayer.appendChild(el('text', { x, y: pad, class: 'hint', 'font-weight':600 }, t));
  head(sysCol, 'systems'); head(sharedCol, 'shared layers'); head(engCol, 'engines');
}

// ---- DRILL-IN ------------------------------------------------------------
function drawSystem(sys) {
  crumb.textContent = 'overview  ›  ' + sys.name;
  backBtn.style.display = '';
  closeDetail();
  buildLegend('system');
  clear(svg);
  const H = svg.clientHeight;
  svg.setAttribute('height', H);
  // The `loop` stage is metadata (back_to/back_from/label/tools), not a drawn
  // box -- change #3 replaces its old standalone marker box with a bounding
  // rect around the stages it actually spans, so it's excluded from the row.
  const lp = sys.stages.find(s => s.kind === 'loop');
  const drawn = sys.stages.filter(s => s.kind !== 'loop');
  const bw = 150, bh = 62, gap = 34;
  const totalW = drawn.length * bw + (drawn.length - 1) * gap;
  // Long pipelines can exceed the viewport (7 stages need ~1334px); scale the
  // whole row down via viewBox instead of clipping the last box. Same svg is
  // reused across views, so the narrow path must remove a lingering viewBox.
  const needW = totalW + 80;
  let W = svg.clientWidth || 1200;
  if (needW > W) { svg.setAttribute('viewBox', '0 0 ' + needW + ' ' + H); W = needW; }
  else svg.removeAttribute('viewBox');
  const x0 = Math.max(40, (W - totalW) / 2), y = 150;

  svg.appendChild(el('text', { x: x0, y: 60, class: 'lbl', 'font-size': 18, 'font-weight': 700 }, sys.name));
  svg.appendChild(el('text', { x: x0, y: 84, class: 'sub2', 'font-size': 13 }, sys.kind + ' — ' + sys.blurb));
  svg.appendChild(el('text', { x: x0, y: 108, class: 'hint' }, 'modules: ' + sys.modules.join(', ')));

  const groups = el('g'); svg.appendChild(groups);   // loop bounding rects, drawn first (behind stages)
  const edges = el('g'); svg.appendChild(edges);
  const idx = id => drawn.findIndex(s => s.id === id);
  const cx = i => x0 + i * (bw + gap) + bw/2;

  // Loop span (index range + rect x-bounds), computed once so both the
  // straight in/out edges below and the bounding rect further down agree on
  // exactly the same rectangle -- see the `if (lp)` block below for why
  // `from`/`to` are found by declared span, not array position.
  let loopSpan = null;
  if (lp) {
    const from = idx(lp.back_from), to = lp.back_to ? idx(lp.back_to) : 0;
    if (from >= 0 && to >= 0 && from >= to) {
      loopSpan = { from, to, rx1: cx(to) - bw/2 - 14, rx2: cx(from) + bw/2 + 14 };
    }
  }

  drawn.forEach((stg, i) => {
    const x = x0 + i * (bw + gap);
    if (i > 0) {
      const px = x0 + (i - 1) * (bw + gap) + bw;
      // An edge crossing the loop's boundary connects to the bounding rect,
      // not the stage box just inside it -- otherwise the arrow reads as
      // pointing at SEARCH specifically rather than at "the loop" as a unit.
      let x1 = px, x2 = x;
      if (loopSpan) {
        if (i === loopSpan.to) x2 = loopSpan.rx1;
        if (i - 1 === loopSpan.from) x1 = loopSpan.rx2;
      }
      edges.appendChild(el('path', { class: 'edge', stroke: 'var(--muted)', 'marker-end':'url(#arw)',
        d: `M ${x1} ${y + bh/2} L ${x2} ${y + bh/2}` }));
    }
    const g = el('g', { class: 'stage', tabindex: 0, role: 'button',
                        'aria-label': 'Open ' + stg.label + ' detail',
                        'data-stage-id': stg.id, 'data-kind': stg.kind });
    if (stg.run) g.setAttribute('data-run', stg.run);
    g.appendChild(el('rect', { x, y, width: bw, height: bh, class: 'k-' + stg.kind }));
    g.appendChild(el('text', { x: x + bw/2, y: y + 26, 'text-anchor': 'middle', class: 'lbl', 'font-weight': 600 }, stg.label));
    g.appendChild(el('text', { x: x + bw/2, y: y + 44, 'text-anchor': 'middle', class: 'sub2' }, stg.kind));
    if (stg.run) {
      g.appendChild(el('text', { x: x + bw - 8, y: y + 16, 'text-anchor': 'end', class: 'runbadge', 'font-size': 9 },
        stg.run.toUpperCase()));
    }
    if (stg.note) {
      g.addEventListener('mousemove', ev => showTip(ev, '<b>'+stg.label+'</b><br>'+stg.note));
      g.addEventListener('mouseleave', hideTip);
    }
    const open = () => showDetail(sys, stg);
    g.addEventListener('click', open);
    g.addEventListener('keydown', ev => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); open(); } });
    svg.appendChild(g);
  });

  // Loop-back arrow + bounding rect for agents. The cycle's span is DECLARED
  // by the `loop` stage (back_to = first stage inside the loop, back_from =
  // last one), never inferred from array position: `length - 2` silently
  // swept post-loop stages into the cycle (aus_agent's MAP CITES,
  // ali_deepresearch's FORMAT), drawing the repeat over formatting steps that
  // run exactly once. No back_from -> no arrow/rect, because a wrong one is
  // worse than a missing one.
  //
  // Found by `kind`, not by array position (`stages[0]`): that assumed the
  // loop is always the pipeline's very first activity, true for aus_agent and
  // ali_deepresearch (nothing precedes their loop) but not facet_rag, whose
  // PLAN stage genuinely runs once before the per-facet loop begins -- with
  // the position-based lookup, `stages[0]` resolved to PLAN (kind `llm`), the
  // `kind === 'loop'` check silently failed, and the back-edge was never
  // drawn at all, making an actually-repeating search/analyze/curate chain
  // render as flat and sequential with no visual indication it loops.
  if (loopSpan) {
    const { from, to, rx1, rx2 } = loopSpan;
    // Bounding rect around the loop's span (change #3), replacing the old
    // standalone marker box. `parallel_over` (facet_rag: facets run
    // concurrently, not just sequentially within one facet) is drawn as a
    // stack of ghost copies behind the main rect -- concurrency and
    // sequential repeat are two different facts about the same span, so
    // they get two different visual channels (depth vs. the dashed arrow)
    // instead of overloading one arrow to mean both.
    const ry1 = y - 26, ry2 = y + bh + 14;
    const rectAttrs = { x: rx1, y: ry1, width: rx2 - rx1, height: ry2 - ry1, rx: 12 };
    const gGroup = el('g', { class: 'loop-group', 'data-loop': lp.id,
                             'data-parallel': lp.parallel_over || '' });
    if (lp.parallel_over) {
      gGroup.appendChild(el('rect', { ...rectAttrs, x: rx1 + 12, y: ry1 - 12, class: 'loop-rect ghost2' }));
      gGroup.appendChild(el('rect', { ...rectAttrs, x: rx1 + 6, y: ry1 - 6, class: 'loop-rect ghost1' }));
    }
    gGroup.appendChild(el('rect', { ...rectAttrs, class: 'loop-rect' }));
    const label = lp.label + (lp.parallel_over ? ' × ' + lp.parallel_over + ' (concurrent)' : '');
    gGroup.appendChild(el('text', { x: rx1 + 10, y: ry1 + 16, class: 'loop-label' }, label));
    groups.appendChild(gGroup);

    // Back-edge arrow below the row so it doesn't collide with the rect's
    // label band above the boxes.
    const lx1 = cx(from), lx0 = cx(to);
    edges.appendChild(el('path', { class: 'edge', stroke: 'var(--accent)', 'stroke-dasharray':'5 4', 'marker-end':'url(#arw)',
      d: `M ${lx1} ${y+bh} C ${lx1} ${y+bh+50}, ${lx0} ${y+bh+50}, ${lx0} ${y+bh}` }));
    svg.appendChild(el('text', { x: (lx0+lx1)/2, y: y+bh+64, 'text-anchor':'middle', class:'hint' },
      lp.back_label || 'repeat until answer'));
  }
  // arrow marker
  const defs = el('defs');
  const m = el('marker', { id: 'arw', viewBox: '0 0 10 10', refX: 9, refY: 5,
    markerWidth: 7, markerHeight: 7, orient: 'auto-start-reverse' });
  m.appendChild(el('path', { d: 'M 0 0 L 10 5 L 0 10 z', fill: 'var(--muted)' }));
  defs.appendChild(m); svg.appendChild(defs);
}

// Deep link: #<system-name> opens that system's pipeline directly, so a run can
// launch straight into the system it just executed. Empty hash = overview.
function route() {
  const want = decodeURIComponent((location.hash || '').replace(/^#/, ''));
  const sys = MODEL.systems.find(s => s.name === want);
  if (sys) drawSystem(sys); else drawOverview();
}
backBtn.addEventListener('click', () => {
  if (location.hash) location.hash = ''; else drawOverview();
});
document.addEventListener('keydown', ev => {
  if (ev.key !== 'Escape') return;
  if (!detail.hidden) { closeDetail(); return; }
  if (location.hash) location.hash = ''; else drawOverview();
});
window.addEventListener('hashchange', route);
window.addEventListener('resize', route);
route();
</script>
</body>
</html>
